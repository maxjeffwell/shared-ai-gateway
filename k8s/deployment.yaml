---
# Shared AI Gateway - Node.js Express server that routes AI requests
# Provides fallback chain: Groq -> Local GPU -> Anthropic
#
# SECRET SETUP (run before applying this file):
# kubectl create secret generic ai-gateway-credentials \
#   --from-literal=GROQ_API_KEY=<your-groq-key> \
#   --from-literal=ANTHROPIC_API_KEY=<your-anthropic-key>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-ai-gateway
  labels:
    app: shared-ai-gateway
    component: ai-gateway
    portfolio: "true"
    tier: ai
spec:
  # 2026-10-01: 2 replicas + zero-downtime rollout (cache is in Redis, so
  # instances are interchangeable). PDB in pdb.yaml keeps one up during drains.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: shared-ai-gateway
  template:
    metadata:
      labels:
        app: shared-ai-gateway
        component: ai-gateway
        portfolio: "true"
        tier: ai
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37
          command: ['sh', '-c', 'until nc -z vertex-kafka-kafka-bootstrap.microservices.svc 9092; do echo "Waiting for Kafka..."; sleep 5; done']
          # default-quota rejects any container without requests + a memory
          # limit -- including init containers.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: ai-gateway
          image: maxjeffwell/shared-ai-gateway:af52b0b9d2d0d4225386d8f8973ff58b37e160d5   # pinned: mirror.gcr.io (neon/dm) serves stale :latest
          ports:
            - containerPort: 8002
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8002"
            - name: BACKEND_PREFERENCE
              value: "auto"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-credentials
                  key: GROQ_API_KEY
            - name: GROQ_MODEL
              value: "openai/gpt-oss-120b"   # 2026-10-01: Groq retired llama-3.3-70b-versatile
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-credentials
                  key: ANTHROPIC_API_KEY
            - name: ANTHROPIC_MODEL
              value: "claude-sonnet-4-20250514"
            - name: CACHE_ENABLED
              value: "true"
            - name: REDIS_URL
              value: "redis://:redis123@redis:6379"
            - name: LITELLM_URL
              value: "https://litellm.el-jefe.me"
            # Embeddings: OpenVINO Model Server on the Intel iGPU (e5-large, 1024-d).
            # Replaced the Triton/bge tiers 2026-09-30. Both tiers point at OVMS.
            - name: EMBEDDING_API
              value: "openai"
            - name: EMBEDDING_PRIMARY_URL
              value: "http://ovms-embeddings.ovms:8000"
            - name: EMBEDDING_FALLBACK_URL
              value: "http://ovms-embeddings.ovms:8000"
            - name: EMBEDDING_MODEL
              value: "e5-large"
            # Text generation Tier 0: OVMS qwen2.5-1.5b-instruct. 2026-10-02: own pod ovms-llm on neonmarmoset Xe.
            - name: OVMS_LLM_URL
              value: "http://ovms-llm.ovms:8000/v3"
            - name: OVMS_LLM_MODEL
              value: "qwen2.5-1.5b-instruct"
            - name: RUNPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-credentials
                  key: RUNPOD_API_KEY
            - name: RUNPOD_ENDPOINT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-credentials
                  key: RUNPOD_ENDPOINT_ID
            - name: KAFKA_ENABLED
              value: "true"
            - name: KAFKA_BROKERS
              value: "vertex-kafka-kafka-bootstrap.microservices.svc:9092"
            - name: KAFKA_AI_EVENTS_TOPIC
              value: "ai.gateway.events"
            - name: LUNARY_API_URL
              value: "http://lunary-backend.lunary.svc.cluster.local:3333"
            - name: LUNARY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-credentials
                  key: LUNARY_PUBLIC_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /livez
              port: 8002
            periodSeconds: 5
            failureThreshold: 24   # 24 × 5s = 120s max startup (Kafka init + backend warmup)
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8002
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /livez   # NOT /health - it calls RunPod/local backends and times out under load
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shared-ai-gateway
  labels:
    app: shared-ai-gateway
    component: ai-gateway
    tier: ai
spec:
  type: ClusterIP
  selector:
    app: shared-ai-gateway
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP
---
# Network policy to allow portfolio apps to reach AI gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-ai-gateway
  labels:
    app: shared-ai-gateway
    component: ai-gateway
    tier: ai
spec:
  podSelector:
    matchLabels:
      app: shared-ai-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              portfolio: "true"
      ports:
        - protocol: TCP
          port: 8002
---
# Allow gateway to send trace/thread events to Lunary backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-lunary
  labels:
    app: shared-ai-gateway
    component: ai-gateway
    tier: ai
spec:
  podSelector:
    matchLabels:
      app: shared-ai-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lunary
      ports:
        - protocol: TCP
          port: 3333
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
