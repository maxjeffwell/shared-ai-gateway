---
# LiteLLM Proxy - OpenAI-compatible proxy for multiple LLM providers
# Enables Lens Loop observability for Claude and Groq
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels:
    app: litellm
    component: ai-proxy
    tier: ai
data:
  config.yaml: |
    model_list:
      # Anthropic Claude models
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-4-20250514
          api_key: "os.environ/ANTHROPIC_API_KEY"
      - model_name: claude-sonnet-4-20250514
        litellm_params:
          model: anthropic/claude-sonnet-4-20250514
          api_key: "os.environ/ANTHROPIC_API_KEY"
      # Groq models (for code-talk, educationelly apps)
      - model_name: groq-llama
        litellm_params:
          model: groq/openai/gpt-oss-120b   # 2026-10-01: Groq retired llama-3.3-70b-versatile; alias kept for callers
          api_key: "os.environ/GROQ_API_KEY"
      - model_name: llama-3.3-70b-versatile
        litellm_params:
          model: groq/openai/gpt-oss-120b   # 2026-10-01: Groq retired llama-3.3-70b-versatile; alias kept for callers
          api_key: "os.environ/GROQ_API_KEY"
      # Local model: OVMS qwen2.5-1.5b-instruct on the Intel iGPU (OpenAI API at /v3).
      # 2026-10-02: ollama removed; ollama-llama3.2-3b alias dropped (no callers).
      - model_name: local-llama
        litellm_params:
          model: openai/qwen2.5-1.5b-instruct
          api_base: http://ovms-llm.ovms.svc.cluster.local:8000/v3
          api_key: "unused"

    litellm_settings:
      drop_params: true
      set_verbose: false
      success_callback: ["lunary"]
      failure_callback: ["lunary"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
    component: ai-proxy
    portfolio: "true"
    tier: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        component: ai-proxy
        portfolio: "true"
        tier: ai
    spec:
      # Not pinned to the edge any more (2026-10-07). It was put on role=edge
      # on 9/25 because its upstreams were Anthropic/Groq over the internet,
      # but it now also routes to OVMS (ovms-llm, home) and logs every call to
      # lunary-backend (home): per-request home traffic, which the edge rule
      # excludes (edge = only things that serve files). The scheduler places
      # it; the VPS role=edge PreferNoSchedule taint keeps it at home.
      # 2026-10-09: CPU-heavy (7d p95 183m) -> PREFER the CPU node m920s
      # (label homelab/cpu-tier=high); a weighted preference, never a pin.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: homelab/cpu-tier
                    operator: In
                    values: ["high"]
      initContainers:
        - name: install-lunary
          image: python:3.13-slim
          command: ["pip", "install", "--target=/opt/lunary", "lunary"]
          volumeMounts:
            - name: lunary-pkg
              mountPath: /opt/lunary
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      containers:
        - name: litellm
          # Pinned: newer main-latest builds refuse to start without LITELLM_MASTER_KEY (UnsafeMasterKeyError)
          image: ghcr.io/berriai/litellm@sha256:32c04b00bc1a720e6d5eeb56a7e72f4e1e7d1e538e779c59b990cbddfd5e27da
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          env:
            - name: PYTHONPATH
              value: "/opt/lunary"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: api-key
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-credentials
                  key: api-key
            - name: LUNARY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-credentials
                  key: LUNARY_PUBLIC_KEY
            - name: LUNARY_API_URL
              value: "http://lunary-backend.lunary.svc.cluster.local:3333"
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              # 2Gi gives startup-time headroom; steady-state is ~450–770Mi.
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: lunary-pkg
              mountPath: /opt/lunary
          livenessProbe:
            httpGet:
              path: /health/liveliness  # Don't use /health - it makes real API calls!
              port: 4000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness  # Don't use /health - it makes real API calls!
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: lunary-pkg
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app: litellm
    component: ai-proxy
    tier: ai
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
---
# Network policy to allow cloudflared tunnel to reach LiteLLM
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-to-litellm
  labels:
    app: litellm
    component: ai-proxy
    tier: ai
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared-ai-gateway
      ports:
        - protocol: TCP
          port: 4000
